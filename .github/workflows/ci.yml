name: CI

on:
  push:
    branches: [main]
  pull_request:

# No secrets, no untrusted input (no github.event.* interpolation): static commands only.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Tests (sandboxed, no network, no real login)
        run: bash tests/claude-account.test.sh

      - name: shellcheck
        run: shellcheck bin/claude-account bin/claude-account.completion.sh install.sh tests/claude-account.test.sh demo/fake-usage
