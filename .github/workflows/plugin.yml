name: Plugin

on:
  push:
    branches: [main]
  pull_request:

# No secrets, no untrusted input (no github.event.* interpolation): static commands only.
permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22

      # The Claude Code build the mod is tested on. Neither step needs a login.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.312

      - name: Validate the plugin and the marketplace
        run: claude plugin validate --strict .

      - name: Mod tests
        run: claude plugin test .

      - name: shellcheck the demo setup
        run: shellcheck demo/mod-setup.sh
